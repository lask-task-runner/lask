name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        type: string
      check_version:
        description: "Verify that package.yaml version matches the specified version"
        required: true
        type: boolean
        default: true
      ref:
        description: "Branch or tag to build from (e.g. main, v0.1.0)"
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  verify_version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Verify package.yaml version matches input
        if: inputs.check_version
        shell: bash
        run: |
          PACKAGE_VERSION="$(awk '/^version:/ { print $2; exit }' package.yaml)"
          INPUT_VERSION="${{ inputs.version }}"

          echo "package.yaml version: ${PACKAGE_VERSION}"
          echo "input version:        ${INPUT_VERSION}"

          test "${PACKAGE_VERSION}" = "${INPUT_VERSION}"

  build:
    needs: verify_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-26-intel
            target: macos-amd64
          - os: macos-26
            target: macos-arm64
          - os: windows-latest
            target: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Haskell Stack
        uses: haskell/actions/setup@v2
        with:
          ghc-version: "9.4"
          enable-stack: true
          stack-version: "latest"

      - name: Build binary
        shell: bash
        run: |
          stack build --copy-bins --local-bin-path dist/bin

      - name: Package for Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p dist/release
          cp dist/bin/lask dist/release/lask
          tar -C dist/release -czf "lask-v${VERSION}-${{ matrix.target }}.tar.gz" lask
          shasum -a 256 "lask-v${VERSION}-${{ matrix.target }}.tar.gz" > "lask-v${VERSION}-${{ matrix.target }}.tar.gz.sha256"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/bin/lask.exe dist/release/lask.exe
          Compress-Archive -Path dist/release/lask.exe -DestinationPath "lask-v$version-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "lask-v$version-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "lask-v$version-${{ matrix.target }}.zip.sha256" -Value "$hash  lask-v$version-${{ matrix.target }}.zip"

      - name: Package Debian (.deb)
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PKGROOT="dist/deb"
          mkdir -p "${PKGROOT}/DEBIAN" "${PKGROOT}/usr/bin"
          install -m 0755 dist/bin/lask "${PKGROOT}/usr/bin/lask"
          cat > "${PKGROOT}/DEBIAN/control" <<EOF
          Package: lask
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Lask maintainers <maintainers@lask.dev>
          Description: Lask is a task runner based on functional programming.
          EOF
          dpkg-deb --build "${PKGROOT}" "lask_${VERSION}_amd64.deb"
          sha256sum "lask_${VERSION}_amd64.deb" > "lask_${VERSION}_amd64.deb.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lask-*.tar.gz
            lask-*.zip
            lask_*.deb
            lask-*.sha256
            lask_*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect all release files
        shell: bash
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lask-${{ inputs.version }}
          path: out/*
          retention-days: 90
