name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        type: string
      check_version:
        description: "Verify that package.yaml version matches the specified version"
        required: true
        type: boolean
        default: true
      ref:
        description: "Branch or tag to build from (e.g. main, v0.1.0)"
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-26-intel
            target: macos-amd64
          - os: macos-26
            target: macos-arm64
          - os: windows-latest
            target: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The macOS images from 20261013 carry Command Line Tools 27, whose
      # SDK lists the arm64e.x1 architecture, which the linker of the
      # default Xcode 26 cannot read. GHC's bindist links against the
      # Command Line Tools' MacOSX.sdk by path whatever SDKROOT says, so
      # that link is pointed at the default Xcode's own SDK, and the build
      # uses that Xcode's tools.
      - name: Use the default Xcode's SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          developer_dir=/Applications/Xcode.app/Contents/Developer
          sdk=$(DEVELOPER_DIR=$developer_dir xcrun --sdk macosx --show-sdk-path)
          sudo ln -sfn "$sdk" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          ls -l /Library/Developer/CommandLineTools/SDKs
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"

      - name: Setup Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4"
          enable-stack: true
          stack-version: "latest"

      - name: Build binary
        shell: bash
        run: |
          stack build --copy-bins --local-bin-path dist/bin

      # The packaging is main.lask's `release-package` task, run by the
      # binary just built. It also checks package.yaml's version, which
      # the binary is built from, before writing anything.
      - name: Package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          CHECK_VERSION: ${{ inputs.check_version }}
        run: dist/bin/lask run release-package "$VERSION" "$TARGET" --check-version "$CHECK_VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lask-*.tar.gz
            lask-*.zip
            lask-*.deb
            lask-*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lask-${{ inputs.version }}
          path: out/*
          retention-days: 90
