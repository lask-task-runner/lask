# Release notes for maintainers:
# - The release workflow publishes APT repository metadata to the `gh-pages` branch.
# - Configure these repository secrets before publishing tags:
#   - APT_GPG_PRIVATE_KEY: ASCII-armored private key used to sign APT metadata.
#   - APT_GPG_PASSPHRASE: passphrase for the private key.
#   - APT_GPG_KEY_ID (optional): key ID to use for signing. If omitted, the first imported secret key is used.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-15-intel
            target: macos-amd64
          - os: macos-15
            target: macos-arm64
          - os: windows-latest
            target: windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell Stack
        uses: haskell/actions/setup@v2
        with:
          ghc-version: "9.4"
          enable-stack: true
          stack-version: "latest"

      - name: Build binary
        shell: bash
        run: |
          stack build --copy-bins --local-bin-path dist/bin

      - name: Package for Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          cp dist/bin/lask dist/release/lask
          tar -C dist/release -czf "lask-v${VERSION}-${{ matrix.target }}.tar.gz" lask
          shasum -a 256 "lask-v${VERSION}-${{ matrix.target }}.tar.gz" > "lask-v${VERSION}-${{ matrix.target }}.tar.gz.sha256"

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/bin/lask.exe dist/release/lask.exe
          Compress-Archive -Path dist/release/lask.exe -DestinationPath "lask-v$version-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "lask-v$version-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "lask-v$version-${{ matrix.target }}.zip.sha256" -Value "$hash  lask-v$version-${{ matrix.target }}.zip"

      - name: Package Debian (.deb)
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKGROOT="dist/deb"
          mkdir -p "${PKGROOT}/DEBIAN" "${PKGROOT}/usr/bin"
          install -m 0755 dist/bin/lask "${PKGROOT}/usr/bin/lask"
          cat > "${PKGROOT}/DEBIAN/control" <<EOF
          Package: lask
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Lask maintainers <maintainers@lask.dev>
          Description: Lask is a task runner based on functional programming.
          EOF
          dpkg-deb --build "${PKGROOT}" "lask_${VERSION}_amd64.deb"
          sha256sum "lask_${VERSION}_amd64.deb" > "lask_${VERSION}_amd64.deb.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lask-*.tar.gz
            lask-*.zip
            lask_*.deb
            lask-*.sha256
            lask_*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;

      - name: Build APT repository files
        shell: bash
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ] || [ -z "${APT_GPG_PASSPHRASE}" ]; then
            echo "APT signing secrets are required: APT_GPG_PRIVATE_KEY and APT_GPG_PASSPHRASE"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

          mkdir -p apt-repo/pool/main/l/lask
          cp artifacts/linux-amd64/lask_*.deb apt-repo/pool/main/l/lask/

          mkdir -p apt-repo/dists/stable/main/binary-amd64
          apt-ftparchive packages apt-repo/pool > apt-repo/dists/stable/main/binary-amd64/Packages
          gzip -kf apt-repo/dists/stable/main/binary-amd64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="lask-task-runner" \
            -o APT::FTPArchive::Release::Label="lask" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release apt-repo/dists/stable > apt-repo/dists/stable/Release

          export GNUPGHOME="$(mktemp -d)"
          echo "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

          if [ -n "${APT_GPG_KEY_ID}" ]; then
            KEY_ID="${APT_GPG_KEY_ID}"
          else
            KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          fi

          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE}" \
            --default-key "${KEY_ID}" \
            --clearsign -o apt-repo/dists/stable/InRelease apt-repo/dists/stable/Release

          gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE}" \
            --default-key "${KEY_ID}" \
            --armor --detach-sign -o apt-repo/dists/stable/Release.gpg apt-repo/dists/stable/Release

          gpg --batch --yes --output apt-repo/lask-archive-keyring.gpg --dearmor < <(gpg --batch --yes --armor --export "${KEY_ID}")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

      - name: Publish APT repository to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: apt-repo
          force_orphan: true
