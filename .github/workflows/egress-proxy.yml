name: Egress proxy

# Builds the egress proxy (egress-proxy/, spec 10.12) for linux/amd64 and
# linux/arm64, publishes it to ghcr.io, and signs it. The digest it
# reports is what a release runs: it is written into
# src/Language/Lask/Runtime/EgressProxy.hs by a pull request, so that
# the proxy a Lask release starts is fixed by that release.
#
# Only this job may publish packages or request a signing identity.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "egress-proxy/**"
      - ".github/workflows/egress-proxy.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/lask-task-runner/lask-egress-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: egress-proxy/go.mod

      - name: Test
        working-directory: egress-proxy
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: egress-proxy
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Report the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### lask-egress-proxy"
            echo
            echo "Published \`$IMAGE@$DIGEST\` from ${{ github.sha }}."
            echo
            echo "For a release to run it, set in \`src/Language/Lask/Runtime/EgressProxy.hs\`:"
            echo
            echo '```haskell'
            echo "embeddedProxyImage = Just \"$IMAGE@$DIGEST\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
