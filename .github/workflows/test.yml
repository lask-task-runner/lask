name: CI

on:
  push:
    # Every branch, so flaky or environment-dependent failures surface
    # on the branch that introduced them rather than at merge time.
    # '**' (not '*') is needed to match slashes, e.g. feature/foo.
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4"
          enable-stack: true
          stack-version: "latest"

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Install dependencies
        run: stack build --only-dependencies

      # lask is built first so that the rest of CI is main.lask's `ci`
      # task, run by the binary this commit produced. The copy in
      # dist/bin is the one that runs it: `stack test --coverage`
      # relinks the one in the install root while the task is running.
      - name: Build project
        run: stack build --copy-bins --local-bin-path dist/bin

      # The completion smoke test drives each shell it finds; one that
      # is missing is skipped, not failed.
      - name: Install shells for the completion smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y zsh fish

      - name: Test
        run: dist/bin/lask run ci

      - name: Summarize coverage
        run: dist/bin/lask eval --stdout-encode text coverage-report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .stack-work/install/**/hpc/
