name: CI

on:
  push:
    # Every branch, so flaky or environment-dependent failures surface
    # on the branch that introduced them rather than at merge time.
    # '**' (not '*') is needed to match slashes, e.g. feature/foo.
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haskell Stack
        uses: haskell-actions/setup@v2
        with:
          # Stack alone: it installs the GHC the snapshot in stack.yaml
          # names, so a global GHC would only be one more to download.
          enable-stack: true
          stack-no-global: true
          stack-version: "latest"

      - name: Cache Stack dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Install dependencies
        run: stack build --only-dependencies

      # lask is built first so that the rest of CI is main.lask's `ci`
      # task, run by the binary this commit produced. The copy in
      # dist/bin is the one that runs it: `stack test --coverage`
      # relinks the one in the install root while the task is running.
      - name: Build project
        run: stack build --copy-bins --local-bin-path dist/bin

      # The completion smoke test drives each shell it finds; one that
      # is missing is skipped, not failed.
      - name: Install shells for the completion smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y zsh fish

      - name: Test
        run: dist/bin/lask run ci

      - name: Summarize coverage
        run: dist/bin/lask eval --stdout-encode text coverage-report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .stack-work/install/**/hpc/

      # The same examples on the other engines lask drives (spec 10.10),
      # with the binary this commit produced. Podman is on the runner
      # already, rootless; catatonit is the init process it runs for
      # `--init`.
      - name: Set up podman
        run: sudo apt-get install -y podman catatonit

      - name: Smoke test on podman
        run: dist/bin/lask run smoke-engine podman --lask dist/bin/lask

      # nerdctl drives the containerd that Docker runs on, with BuildKit
      # from the same bundle for recipes. It runs as root, so the client
      # is a wrapper that runs it with sudo, keeping the environment a
      # variable passed by name is read from.
      - name: Set up nerdctl
        run: |
          curl -fsSL https://github.com/containerd/nerdctl/releases/download/v2.4.1/nerdctl-full-2.4.1-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local
          sudo systemctl daemon-reload
          sudo systemctl enable --now buildkit
          mkdir -p "$RUNNER_TEMP/nerdctl-bin"
          printf '#!/bin/sh\nexec sudo -E /usr/local/bin/nerdctl "$@"\n' > "$RUNNER_TEMP/nerdctl-bin/nerdctl"
          chmod +x "$RUNNER_TEMP/nerdctl-bin/nerdctl"
          echo "$RUNNER_TEMP/nerdctl-bin" >> "$GITHUB_PATH"

      - name: Smoke test on nerdctl
        run: dist/bin/lask run smoke-engine nerdctl --lask dist/bin/lask
