<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lask tour</title>
<!--
  The Lask tour video, drawn frame by frame.

  One shape carries it: a task, drawn as the Lask logo's rounded square.
  The code is shown once, at the start, and folds into that square; after
  that there are only simple shapes and a few words.

  window.render(t) draws the frame at t seconds from t alone, so frames can
  be drawn in any order. render.mjs captures them; open this file in a
  browser to watch it play. ?short plays the README cut.
-->
<style>
  :root {
    --bg: #000; --fg: #f5f5f7; --dim: #86868b;
    --blue: #2997ff; --green: #30d158; --red: #ff453a; --amber: #ffb340;
    --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .a { position: absolute; will-change: transform, opacity, filter; }
  .w { left: 0; width: 1280px; text-align: center; font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; }
  svg { overflow: visible; }
  .k { color: #ff7ab2; } .s { color: #fc6a5d; } .im { color: #5dd8ff; } .fn { color: #d0a8ff; } .am { color: #ffb340; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const SHORT = location.search.includes("short");
const stage = document.getElementById("stage");

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// fades in from a, out by b
const env = (t, a, b, din = .6, dout = .5) => Math.min(eo(P(t, a, a + din)), 1 - eio(P(t, b - dout, b)));

function add(html, css, parent = stage, cls = "") {
  const d = document.createElement("div");
  d.className = "a " + cls;
  d.style.cssText = css;
  d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
function S(e, o) {
  const op = o.o ?? 1;
  e.style.opacity = op;
  e.style.visibility = op <= .002 ? "hidden" : "visible";
  e.style.transform = `translate(${o.x || 0}px,${o.y || 0}px) scale(${o.s ?? 1})`;
  e.style.filter = o.b ? `blur(${o.b}px)` : "none";
}
const NS = "http://www.w3.org/2000/svg";
function el(parent, tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const A = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };

const R = [];  // per-frame drawers, (t) => void
const CX = 640, CY = 300;

// ---------- words: one line at a time, large, rising into focus ----------
function words(html, a, b, y = 500, size = 64) {
  const e = add(html, `top:${y}px;font-size:${size}px`, stage, "w");
  R.push(t => {
    const o = env(t, a, b, .7, .45);
    S(e, { o, y: (1 - eo5(P(t, a, a + .9))) * 22, b: (1 - o) * 10 });
  });
}
const grad = (s, a, b) => `<span style="background:linear-gradient(90deg,${a},${b});-webkit-background-clip:text;background-clip:text;color:transparent">${s}</span>`;

// ===================================================================
// The code, once (0 - 4.3), folding into the task
// ===================================================================
const CODE = [
  `<span class="k">command</span> { <span class="s">"python"</span> } <span class="k">on</span> <span class="im">#python:3.13.7-alpine3.22</span>`,
  `<span class="k">command</span> { <span class="s">"ruff"</span> } <span class="k">on</span> <span class="im">#ghcr.io/astral-sh/ruff:0.13.3-alpine</span>`,
  ``,
  `<span class="k">access</span> <span class="am">Sandboxed</span> = { secrets: <span class="k">false</span>, runs: [<span class="s">"container"</span>] }`,
  ``,
  `<span class="fn">ci</span>() <span class="k">within</span> <span class="am">Sandboxed</span> = <span class="k">do</span> {`,
  `  lint = <span class="k">async</span> $ ruff check app`,
  `  test = <span class="k">async</span> $ python -m unittest discover -s app`,
  `  all([lint, test])`,
  `}`,
];
const code = add(CODE.map(l => `<div style="height:30px;line-height:30px;white-space:pre">${l || " "}</div>`).join(""),
  "left:300px;top:200px;width:700px;font:500 19px var(--mono);color:#e5e5ea;transform-origin:340px 100px");
const codeName = add("main.lask", "left:0;top:150px;width:1280px;text-align:center;font:600 15px var(--mono);color:#6c7986;letter-spacing:.08em");
R.push(t => {
  const fold = eio(P(t, 3.5, 4.3));
  const o = Math.min(eo(P(t, .3, 1.3)), 1 - P(t, 3.7, 4.25));
  S(code, { o, s: lerp(lerp(.97, 1.02, P(t, .3, 3.5)), .08, fold), y: (1 - eo(P(t, .3, 1.3))) * 14, b: fold * 6 });
  S(codeName, { o: Math.min(eo(P(t, .5, 1.3)), 1 - P(t, 3.3, 3.7)) });
});

// ===================================================================
// The shapes
// ===================================================================
const sv = el(stage, "svg", { width: 1280, height: 720 });
sv.style.cssText = "position:absolute;left:0;top:0";
el(sv, "defs", {}).innerHTML = `
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff453a"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

// a task: the logo's square, its glow, a red state, and a λ that can be drawn
function makeTask(size, parent = sv) {
  const g = el(parent, "g", {});
  const r = { x: -size / 2, y: -size / 2, width: size, height: size, rx: size * .22 };
  const halo = el(g, "rect", { ...r, fill: "url(#tg)", filter: "url(#soft)", opacity: .5 });
  el(g, "rect", { ...r, fill: "url(#tg)" });
  const red = el(g, "rect", { ...r, fill: "url(#rg)", opacity: 0 });
  const k = size / 32;
  const lam = el(g, "path", {
    d: `M${-6.5 * k} ${-8.5 * k}h${3.2 * k}l${9.3 * k} ${17 * k}M${.1 * k} ${-.8 * k}l${-6.6 * k} ${9.3 * k}`,
    fill: "none", stroke: "#fff", "stroke-width": 3 * k, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": "0 1", opacity: 0 });
  return { g, halo, red, lam };
}
const place = (task, x, y, s = 1, o = 1) => A(task.g, { transform: `translate(${x} ${y}) scale(${s})`, opacity: o });
const LOCK = `<circle r="22" fill="#f5f5f7"/><path d="M-7 -1.5h14v11h-14zM-4.5 -1.5v-3.5a4.5 4.5 0 0 1 9 0v3.5" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
const TICK = r => `<circle r="${r}" fill="#30d158"/><path d="M${-r * .4} ${r * .03}l${r * .27} ${r * .27} ${r * .55}-${r * .55}" fill="none" stroke="#000" stroke-width="${r * .18}" stroke-linecap="round" stroke-linejoin="round"/>`;

// what it reaches: the project's files, a package registry, and an attacker,
// with dots streaming to each; the ring lets the first two through
const GREY = "#86868b";
const REACH = [
  { x: CX - 340, y: CY, ok: true, icon: c => `<path d="M-38 -24a6 6 0 0 1 6-6h20l8 9h36a6 6 0 0 1 6 6v39a6 6 0 0 1-6 6h-64a6 6 0 0 1-6-6z" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"/>` },
  { x: CX, y: CY - 210, ok: true, icon: c => `<path d="M0 -36 32 -19v38L0 36-32 19v-38zM-32 -19 0 -2 32 -19M0 -2v38" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"/>` },
  { x: CX + 340, y: CY, ok: false, icon: c => `
      <circle r="62" fill="#ff453a" opacity=".16" filter="url(#soft)"/>
      <path d="M-50 52c5-17 22-25 50-25s45 8 50 25z" fill="#1c1c1e" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-33 30v-26a33 37 0 0 1 66 0v26z" fill="#1c1c1e" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cy="4" rx="19" ry="22" fill="#000"/>
      <rect x="-13" y="-2" width="10" height="4" rx="2" fill="#ff453a"/><rect x="3" y="-2" width="10" height="4" rx="2" fill="#ff453a"/>
      <path d="M-30 38h60l8 14h-76z" fill="#2c2c2e" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>` },
];
REACH.forEach(n => {
  n.len = Math.hypot(n.x - CX, n.y - CY);
  n.ux = (n.x - CX) / n.len; n.uy = (n.y - CY) / n.len;
  n.line = el(sv, "line", { x1: CX + n.ux * 70, y1: CY + n.uy * 70, "stroke-width": 2, "stroke-dasharray": "2 9", "stroke-linecap": "round" });
  n.dots = [...Array(7).keys()].map(k => ({ k, e: el(sv, "circle", { r: 4.2 }) }));
  n.grey = el(sv, "g", {}); n.grey.innerHTML = n.icon(GREY);
  n.lit = el(sv, "g", {}); n.lit.innerHTML = n.icon(n.ok ? "#30d158" : "#ff453a");
});
const stop = el(sv, "g", {});
stop.innerHTML = `<circle r="17" fill="#ff453a"/><path d="M-6 -6l12 12M6 -6l-12 12" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>`;
const ring = el(sv, "circle", { cx: CX, cy: CY, fill: "none", stroke: "#ffb340", "stroke-width": 3, filter: "url(#glow)" });
const shock = el(sv, "circle", { cx: CX, cy: CY, fill: "none", stroke: "#ffb340", "stroke-width": 1.5 });

// a container drawn around the task, and the pin that fixes it
const box = el(sv, "rect", { x: -95, y: -95, width: 190, height: 190, rx: 40, stroke: "#2997ff", "stroke-width": 2.5, pathLength: 1 });
const pin = el(sv, "g", {}); pin.innerHTML = LOCK;
const main = makeTask(110);

// the same container on three machines
const MX = [CX - 340, CX, CX + 340];
const copies = MX.map(() => {
  const g = el(sv, "g", {});
  el(g, "rect", { x: -95, y: -95, width: 190, height: 190, rx: 40, fill: "rgba(41,151,255,.06)", stroke: "#2997ff", "stroke-width": 2.5 });
  place(makeTask(110, g), 0, 0);
  el(g, "g", { transform: "translate(95 -95)" }).innerHTML = LOCK;
  return g;
});
const ICONS = [
  `<path d="M-46 -26h92v56h-92zM-62 38h124" fill="none" stroke="#86868b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`,
  `<path d="M-36 30h68a24 24 0 0 0 2-48 32 32 0 0 0-61-6 22 22 0 0 0-9 54z" fill="none" stroke="#86868b" stroke-width="3" stroke-linejoin="round"/>`,
  `<path d="M-42 -34h84v28h-84zM-42 6h84v28h-84z" fill="none" stroke="#86868b" stroke-width="3" stroke-linejoin="round"/><circle cx="-26" cy="-20" r="3.5" fill="#86868b"/><circle cx="-26" cy="20" r="3.5" fill="#86868b"/>`,
].map(d => { const g = el(sv, "g", {}); g.innerHTML = d; return g; });

// two lanes
const LY = [CY - 70, CY + 70], LX0 = CX - 300, LX1 = CX + 300;
const lanes = LY.map(y => el(sv, "line", { x1: LX0, y1: y, x2: LX1, y2: y, stroke: "#2c2c2e", "stroke-width": 4, "stroke-linecap": "round" }));
const trails = LY.map(y => el(sv, "line", { x1: LX0, y1: y, y2: y, "stroke-width": 4, "stroke-linecap": "round" }));
const runners = LY.map(() => makeTask(64));
const ticks = LY.map(() => { const g = el(sv, "g", {}); g.innerHTML = TICK(22); return g; });

// three tasks, checked
const QX = [CX - 220, CX, CX + 220];
const checked = QX.map(() => makeTask(110));
const scan = el(sv, "rect", { y: CY - 120, width: 3, height: 240, fill: "#30d158", filter: "url(#glow)" });
const qTicks = QX.map(() => { const g = el(sv, "g", {}); g.innerHTML = TICK(20); return g; });

// the close
const FIN = makeTask(150);

R.push(t => {
  // the task appears where the code folded, and stays until the copies
  const tin = P(t, 3.9, 4.7);
  place(main, CX, CY, lerp(.15, 1, back(tin)), Math.min(eo(tin), 1 - P(t, 21.9, 22.2)));
  A(main.halo, { opacity: .42 + .14 * Math.sin(t * 2.4) });

  // ---- what it reaches (6 - 13.2): the ring stops the dots at 9.6
  const RING = 9.6, R0 = 150, after = t >= RING + .15;
  const reachOn = env(t, 6.0, 13.2, .5, .6);
  REACH.forEach((n, i) => {
    const appear = 6.1 + i * .25;
    const no = Math.min(eo(P(t, appear, appear + .6)), 1 - P(t, 12.7, 13.3));
    const end = n.len - 62;
    // before the ring every destination looks the same; after it, allowed is green and the attacker red
    const lit = eo(P(t, RING + .25, RING + .6));
    const icon = `translate(${n.x} ${n.y + (1 - eo(P(t, appear, appear + .7))) * 14}) scale(${n.ok ? 1 : 1.25})`;
    A(n.grey, { transform: icon, opacity: no * (n.ok ? 1 - lit : 1) });
    A(n.lit, { transform: icon, opacity: no * (n.ok ? lit : (t < RING + .25 ? 1 : lerp(1, .35, eo(P(t, RING + .6, RING + 1.4))))) });
    const reach = after && !n.ok ? R0 : end;
    A(n.line, { x2: CX + n.ux * reach, y2: CY + n.uy * reach, opacity: no * .6,
      stroke: after ? (n.ok ? "#30d158" : "#ff453a") : "#5a5a5e" });
    n.dots.forEach(d => {
      const r = 70 + ((t * .42 + d.k / 7) % 1) * (end - 70);
      let o = reachOn * no * clamp((r - 70) / 30) * clamp((end - r) / 30);
      if (after && !n.ok && r > R0) o = 0;
      A(d.e, { cx: CX + n.ux * r, cy: CY + n.uy * r, opacity: o,
        fill: !after ? "#f5f5f7" : n.ok ? "#30d158" : "#ff453a" });
    });
    if (!n.ok) {
      const st = P(t, RING + .3, RING + .6);
      A(stop, { transform: `translate(${CX + n.ux * R0} ${CY + n.uy * R0}) scale(${t < RING + .3 ? 0 : lerp(2, 1, back(st))})`, opacity: no });
    }
  });
  A(ring, { r: R0 * lerp(1.9, 1, back(P(t, RING, RING + .38))), opacity: Math.min(eo(P(t, RING, RING + .1)), 1 - P(t, 12.8, 13.3)) });
  const sh = P(t, RING + .3, RING + 1.1);
  A(shock, { r: R0 * (1 + eo(sh) * .55), opacity: sh > 0 && sh < 1 ? (1 - sh) * .7 : 0 });
  const jolt = sh > 0 && sh < .35 ? (1 - sh / .35) * 6 : 0;
  sv.style.transform = `translate(${Math.sin(t * 90) * jolt}px,${Math.cos(t * 70) * jolt * .5}px)`;

  // ---- in a container (13.6 - 22): the box draws, the pin snaps on
  A(box, { transform: `translate(${CX} ${CY})`, "stroke-dasharray": `${eio(P(t, 13.6, 14.6))} 1`, opacity: t < 13.6 ? 0 : 1 - P(t, 21.9, 22.2),
    fill: `rgba(41,151,255,${.06 * eo(P(t, 14.2, 14.8))})` });
  A(pin, { transform: `translate(${CX + 95} ${CY - 95}) scale(${t < 18.8 ? 0 : lerp(2.2, 1, back(P(t, 18.8, 19.15)))})`,
    opacity: Math.min(eo(P(t, 18.8, 18.9)), 1 - P(t, 21.9, 22.2)) });

  // ---- the same everywhere (22 - 26.8)
  const spread = eio(P(t, 22.0, 23.0));
  copies.forEach((g, i) => {
    A(g, { transform: `translate(${lerp(CX, MX[i], spread)} ${CY - 30}) scale(${lerp(1, .78, spread)})`,
      opacity: Math.min(t >= 22 ? 1 : 0, 1 - P(t, 26.3, 26.8)) * (i === 1 ? 1 : eo(P(t, 22.0, 22.4))) });
  });
  ICONS.forEach((g, i) => {
    const io = Math.min(eo(P(t, 22.7 + i * .12, 23.3 + i * .12)), 1 - P(t, 26.3, 26.8));
    A(g, { transform: `translate(${MX[i]} ${CY + 125 + (1 - io) * 12})`, opacity: io });
  });

  // ---- side by side (26.9 - 31)
  const lo = env(t, 26.9, 31.0, .5, .5);
  const ENDS = [29.3, 29.7];
  LY.forEach((y, i) => {
    A(lanes[i], { opacity: lo });
    const k = eio(P(t, 27.6, ENDS[i]));
    const x = lerp(LX0, LX1, k);
    A(trails[i], { x2: x, opacity: lo, stroke: k >= 1 ? "#30d158" : "#2997ff" });
    place(runners[i], x, y, 1, lo);
    A(ticks[i], { transform: `translate(${LX1 + 60} ${y}) scale(${t < ENDS[i] ? 0 : lerp(.3, 1, back(P(t, ENDS[i], ENDS[i] + .35)))})`,
      opacity: Math.min(lo, eo(P(t, ENDS[i], ENDS[i] + .1))) });
  });

  // ---- checked before it runs (31.2 - 37.6)
  A(scan, { x: lerp(CX - 360, CX + 360, eio(P(t, 32.0, 33.4))), opacity: t > 32.0 && t < 33.5 ? 1 : 0 });
  QX.forEach((x, i) => {
    const bad = i === 1;
    const shake = bad && t >= 32.7 && t < 33.2 ? Math.sin(t * 80) * 10 * (1 - P(t, 32.7, 33.2)) : 0;
    // the middle one becomes the close's task; the others go
    const o = bad ? Math.min(eo(P(t, 31.3, 31.9)), t < 37.6 ? 1 : 0) : Math.min(eo(P(t, 31.2 + i * .1, 31.8 + i * .1)), 1 - P(t, 37.3, 37.8));
    place(checked[i], x + shake, CY, 1, o);
    A(checked[i].red, { opacity: bad && t >= 32.7 ? eo(P(t, 32.7, 32.85)) * (1 - P(t, 34.3, 34.6)) : 0 });
    const a = 34.8 + i * .12;
    A(qTicks[i], { transform: `translate(${x + 55} ${CY - 55}) scale(${t < a ? 0 : lerp(.3, 1, back(P(t, a, a + .35)))})`,
      opacity: Math.min(o, eo(P(t, a, a + .1)), 1 - P(t, 37.3, 37.6)) });
  });

  // ---- the close (37.6 - 48): the task grows, its λ draws, it moves aside for the name
  const fo = Math.min(t >= 37.6 ? 1 : 0, 1 - P(t, 47.4, 48));
  const mv = eio(P(t, 39.0, 39.8));
  place(FIN, lerp(CX, CX - 130, mv), lerp(CY, 250, mv), lerp(110 / 150, 1, eio(P(t, 37.6, 38.6))), fo);
  const lam = eio(P(t, 38.3, 39.0));
  A(FIN.lam, { "stroke-dasharray": `${lam} 1`, opacity: lam > .001 ? 1 : 0 });
});

// the name beside the logo, and the words under it
const name = add("Lask", "left:610px;top:198px;font:700 108px/1 var(--sans);letter-spacing:-.04em");
R.push(t => S(name, { o: Math.min(eo(P(t, 39.6, 40.3)), 1 - P(t, 47.4, 48)), x: (1 - eo5(P(t, 39.6, 40.5))) * -24, b: (1 - eo(P(t, 39.6, 40.3))) * 8 }));
const tag = add(["Pinned.", "Checked.", "Bounded."].map(w => `<span style="display:inline-block;margin:0 10px">${w}</span>`).join(""),
  "left:0;top:378px;width:1280px;text-align:center;font:600 46px var(--sans);letter-spacing:-.03em");
const TW = [...tag.children];
[["#2997ff", "#5ac8fa"], ["#30d158", "#a6f4c5"], ["#ffb340", "#ffd60a"]].forEach(([a, b], i) => {
  TW[i].style.cssText += `;background:linear-gradient(90deg,${a},${b});-webkit-background-clip:text;background-clip:text;color:transparent`;
});
const brew = add(`<span style="color:#86868b">$</span> brew install lask`, "left:0;top:500px;width:1280px;text-align:center;font:500 24px var(--mono)");
const url = add("lask-task-runner.github.io", "left:0;top:548px;width:1280px;text-align:center;font:500 20px var(--sans);color:#86868b");
R.push(t => {
  const end = 1 - P(t, 47.4, 48);
  TW.forEach((w, i) => {
    const a = 40.6 + i * .45;
    S(w, { o: Math.min(eo(P(t, a, a + .6)), end), y: (1 - eo5(P(t, a, a + .8))) * 18, b: (1 - eo(P(t, a, a + .6))) * 8 });
  });
  S(brew, { o: Math.min(eo(P(t, 42.4, 43.1)), end) });
  S(url, { o: Math.min(eo(P(t, 42.8, 43.5)), end) });
});

// ---------- the words ----------
words("A task.", 4.5, 6.0);
words(`What can it ${grad("reach", "#ff453a", "#ff9f0a")}?`, 6.3, 9.4);
words(`Only what you ${grad("allow", "#ffb340", "#ffd60a")}.`, 10.0, 13.2);
words("Every tool, in a container.", 14.0, 16.3);
words(`Nothing to ${grad("install", "#2997ff", "#5ac8fa")}.`, 16.5, 18.6);

// ---------- timelines ----------
const FULL = 48;
// the README cut: [from, to, speed] of the full timeline, played in turn
const CUTS = [[0, 13.3, 1.8], [13.6, 21.8, 2.0], [22.0, 26.6, 2.0], [31.2, 37.5, 2.2], [37.6, 46, 2.4]];
const CUT_LEN = CUTS.map(([a, b, s]) => (b - a) / s);
window.DURATION = SHORT ? CUT_LEN.reduce((x, y) => x + y, 0) : FULL;
window.POSTER = 45;
function fullTime(t) {
  if (!SHORT) return [t, 1];
  let acc = 0;
  for (let i = 0; i < CUTS.length; i++) {
    const [a, , s] = CUTS[i], len = CUT_LEN[i];
    if (t < acc + len || i === CUTS.length - 1) {
      const local = t - acc;
      const dip = i === 0 ? 1 : clamp(local / .15);
      const out = i === CUTS.length - 1 ? 1 : clamp((len - local) / .15);
      return [a + Math.min(local, len) * s, Math.min(dip, out)];
    }
    acc += len;
  }
}
window.render = t => {
  const [ft, vis] = fullTime(t);
  R.forEach(f => f(ft));
  stage.style.opacity = vis;
};
window.render(0);
if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  loop();
}
