<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lask tour</title>
<!--
  The Lask tour video, drawn frame by frame.

  window.render(t) draws the frame at t seconds, from t alone, so any frame
  can be drawn in any order. render.mjs captures the frames; open this file
  in a browser to watch it play. ?short plays the README cut.
-->
<style>
  :root {
    --bg: #060a11; --fg: #e6edf3; --dim: #7d8590; --faint: #3a4556;
    --blue: #58a6ff; --green: #3fb950; --red: #f85149; --amber: #f2b33d;
    --purple: #d2a8ff; --pink: #ff7b72; --str: #a5d6ff; --com: #6e7681;
    --card: rgba(13, 19, 28, .94); --line: #243042;
    --mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: -80px; }
  .a { position: absolute; will-change: transform, opacity; transform-origin: 0 0; }
  .c { transform-origin: 50% 50%; }
  .mono { font-family: var(--mono); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 70px rgba(0, 0, 0, .55); overflow: hidden; }
  .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .02); font: 600 14px var(--mono); color: var(--dim); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #2a3444; }
  .cap { left: 0; width: 1280px; text-align: center; font: 800 46px/1.1 var(--sans); letter-spacing: -1px; }
  .sub { left: 0; width: 1280px; text-align: center; font: 500 20px var(--mono); color: var(--dim); }
  .row { position: absolute; left: 0; right: 0; white-space: pre; }
  .pill { font: 600 19px var(--mono); padding: 10px 18px; border-radius: 12px; background: #0f1722; border: 1px solid #2a3647; white-space: pre; }
  .k { color: var(--pink); } .s { color: var(--str); } .im { color: var(--blue); } .fn { color: var(--purple); }
  .cm { color: var(--com); } .am { color: var(--amber); } .rd { color: var(--red); } .gr { color: var(--green); } .dm { color: var(--dim); }
  .chip { display: flex; align-items: center; gap: 10px; font: 600 17px var(--mono); }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div></div>
<script>
"use strict";
const SHORT = location.search.includes("short");
const stage = document.getElementById("stage");
const bg = document.getElementById("bg");

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// in at a, out at b
const env = (t, a, b, din = .45, dout = .4) => Math.min(eo(P(t, a, a + din)), 1 - eio(P(t, b - dout, b)));
const typed = (s, t, a, cps = 26) => s.slice(0, Math.max(0, Math.min(s.length, Math.floor((t - a) * cps))));

function add(html, css, parent = stage, cls = "") {
  const d = document.createElement("div");
  d.className = "a " + cls;
  d.style.cssText = css;
  d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
function S(el, o) {
  const op = o.o ?? 1;
  el.style.opacity = op;
  el.style.visibility = op <= .002 ? "hidden" : "visible";
  el.style.transform = `translate(${o.x || 0}px,${o.y || 0}px) scale(${o.s ?? 1}) rotate(${o.r || 0}deg)`;
  if (o.f !== undefined) el.style.filter = o.f;
}
function setHTML(el, h) { if (el._h !== h) { el.innerHTML = h; el._h = h; } }
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// ---------- icons ----------
const I = {
  box: (c = "var(--blue)", w = 24) => `<svg width="${w}" height="${w * .72}" viewBox="0 0 26 18"><rect x="1" y="1" width="24" height="16" rx="2.5" fill="none" stroke="${c}" stroke-width="2"/><path d="M7 4.5v9M11 4.5v9M15 4.5v9M19 4.5v9" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  key: (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4.5"/><path d="M11.3 11.7 20 3M16.5 6.5l2.5 2.5M14 9l2 2"/></svg>`,
  folder: (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5a1.5 1.5 0 0 1 1.5-1.5H9l2 2.2h8.5A1.5 1.5 0 0 1 21 8.7V18a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/><circle cx="12" cy="13.3" r="1.7"/><path d="M12 15v2"/></svg>`,
  globe: (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>`,
  plug: (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M12 8.8V6M12 15.2V18"/></svg>`,
  laptop: (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>`,
  server: (c, w = 26) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/><path d="M8 7.2h.01M8 16.8h.01" stroke-width="3" stroke-linecap="round"/></svg>`,
  lock: (c, w = 16) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>`,
  spark: (c, w = 16) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${c}"><path d="M12 1.5 14.2 9.8 22.5 12 14.2 14.2 12 22.5 9.8 14.2 1.5 12 9.8 9.8z"/></svg>`,
  ok: (w = 30) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#12301c" stroke="#3fb950" stroke-width="1.6"/><path d="M7 12.4l3.2 3.2L17.2 8.6" fill="none" stroke="#3fb950" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  no: (w = 22) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3a1418" stroke="#f85149" stroke-width="1.6"/><path d="M8 8l8 8M16 8l-8 8" stroke="#f85149" stroke-width="2.6" stroke-linecap="round"/></svg>`,
  logo: (w = 64) => `<svg width="${w}" height="${w}" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect width="32" height="32" rx="7" fill="url(#lg)"/><path d="M9.5 7.5h3.2l9.3 17M16.1 15.2l-6.6 9.3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// ---------- the shared layer: captions, shake, flashes ----------
const R = []; // per-frame drawers, each (t) => void
const world = add("", "left:0;top:0;width:1280px;height:720px");
function caption(text, a, b, top = 46, cls = "cap") {
  const el = add(text, `top:${top}px`, stage, cls);
  R.push(t => {
    const o = env(t, a, b, .5, .35);
    S(el, { o, y: (1 - eo(P(t, a, a + .6))) * 18, f: `blur(${(1 - o) * 6}px)` });
  });
  return el;
}

// ===================================================================
// 0. Hook (0 - 11.6): a new task, what it can reach, and within
// ===================================================================
const H = { x: 80, y: 196, w: 560, rowH: 34, pad: 18 };
const hook = add("", "left:0;top:0;width:1280px;height:720px", world);
const hookCard = add(`<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;main.lask</div>`,
  `left:${H.x}px;top:${H.y}px;width:${H.w}px;`, hook, "card");
const hookBody = add("", "left:0;top:38px;width:100%;font:500 20px var(--mono)", hookCard);
const hRows = [0, 1, 2, 3, 4, 5].map(i => add("", `left:0;top:0;width:100%;height:${H.rowH}px;line-height:${H.rowH}px;padding-left:20px;white-space:pre`, hookBody));
const hMove = add("", `left:0;top:0;line-height:${H.rowH}px;white-space:pre;font:500 20px var(--mono)`, hookBody);
const agent = add(`${I.spark("#d2a8ff", 14)}<span>added by an agent</span>`,
  `left:${H.x + H.w - 214}px;top:${H.y + 38 + H.rowH + 6}px;display:flex;gap:7px;align-items:center;font:600 14px var(--sans);color:#d2a8ff;background:#1d1530;border:1px solid #3c2d5c;border-radius:20px;padding:4px 12px`, hook);
// measure one monospace character
const probe = add("0000000000", "font:500 20px var(--mono);white-space:pre;left:-999px");
const CW = probe.getBoundingClientRect().width / 10;
probe.remove();

const TARGETS = [
  { icon: I.folder, label: "~/.ssh", y: 164 },
  { icon: I.key, label: "AWS_SECRET_ACCESS_KEY", y: 280 },
  { icon: I.globe, label: "the internet", y: 396 },
  { icon: I.plug, label: "/var/run/docker.sock", y: 512 },
];
const TX = 850;
const svgNS = "http://www.w3.org/2000/svg";
const hookSvg = document.createElementNS(svgNS, "svg");
hookSvg.setAttribute("width", 1280); hookSvg.setAttribute("height", 720);
hookSvg.style.cssText = "position:absolute;left:0;top:0";
hook.appendChild(hookSvg);
hookSvg.innerHTML = `<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
TARGETS.forEach((g, i) => {
  g.el = add(`<div style="display:flex;align-items:center;gap:14px;height:64px;padding:0 18px">${g.icon("var(--red)")}<span class="mono" style="font:600 18px var(--mono)">${g.label}</span></div>`,
    `left:${TX}px;top:${g.y}px;width:360px;`, hook, "card");
  g.dim = add(`<div style="display:flex;align-items:center;gap:14px;height:64px;padding:0 18px">${g.icon("#3a4556")}<span class="mono" style="font:600 18px var(--mono);color:#4a5568">${g.label}</span></div>`,
    `left:${TX}px;top:${g.y}px;width:360px;`, hook, "card");
  g.path = document.createElementNS(svgNS, "path");
  g.path.setAttribute("fill", "none");
  g.path.setAttribute("stroke", "#f85149");
  g.path.setAttribute("stroke-width", "2.6");
  g.path.setAttribute("stroke-linecap", "round");
  g.path.setAttribute("filter", "url(#glow)");
  g.path.setAttribute("pathLength", "1");
  hookSvg.appendChild(g.path);
  g.spark = add(`<div style="width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff 0,#f2b33d 30%,rgba(242,179,61,0) 70%)"></div>`, "left:-23px;top:-23px", hook);
});
const ring = add("", "border:3px solid var(--amber);border-radius:22px;box-shadow:0 0 0 1px rgba(242,179,61,.25),0 0 40px rgba(242,179,61,.35),inset 0 0 30px rgba(242,179,61,.12)", hook, "c");
const shock = add("", "border:2px solid var(--amber);border-radius:26px", hook, "c");
const err0 = add(`<div style="display:flex;align-items:center;gap:10px">${I.no(20)}<span style="font:700 16px var(--mono);color:var(--red)">E-TYPE-WITHIN-EXCEEDED</span></div><div style="font:500 14px var(--mono);color:#c9d1d9;margin-top:4px;padding-left:30px">npm reaches the network: not allowed (outbound)</div>`,
  "background:#1b0f12;border:1px solid #5a2328;border-radius:12px;padding:10px 14px;white-space:nowrap", hook);
const flash = add("", "left:0;top:0;width:1280px;height:720px;background:radial-gradient(circle at 40% 50%,rgba(242,179,61,.35),rgba(242,179,61,0) 60%)", stage);

const HK = { rows: 8.0, ring: 9.0 };
const ROW = (cls, text) => `<span class="${cls}">${esc(text)}</span>`;
// a row of the diff, in its tokens
const add_ = s => `<span class="gr">+ </span>${s}`;
function bez(ax, ay, bx, by) { return [ax, ay, ax + 150, ay, bx - 170, by, bx, by]; }
function bezAt(c, u) {
  const m = 1 - u;
  return [m * m * m * c[0] + 3 * m * m * u * c[2] + 3 * m * u * u * c[4] + u * u * u * c[6],
    m * m * m * c[1] + 3 * m * m * u * c[3] + 3 * m * u * u * c[5] + u * u * u * c[7]];
}
R.push(t => {
  const g0 = env(t, .25, 11.9, .6, .5);
  S(hook, { o: g0, s: lerp(1, .94, eio(P(t, 11.3, 11.9))), x: lerp(0, 38, eio(P(t, 11.3, 11.9))), y: lerp(0, 22, eio(P(t, 11.3, 11.9))) });
  if (g0 <= 0) return;
  S(hookCard, { o: eo(P(t, .3, .9)), y: (1 - eo(P(t, .3, .9))) * 20 });
  // rows open from 2 to 6
  const open = eio(P(t, HK.rows, HK.rows + .35));
  const r = H.rowH;
  const ys = [0, r, r + r * open, r + 2 * r * open, r + 3 * r * open, r + 4 * r * open].map(y => y + 14);
  hRows.forEach((el, i) => { el.style.top = ys[i] + "px"; });
  hookCard.style.height = (38 + 28 + r * 2 + 4 * r * open) + "px";
  setHTML(hRows[0], `<span class="dm">  test() = $ npm test</span>`);
  const within = typed(" within {", t, HK.rows, 30);
  setHTML(hRows[1], add_(`<span class="fn">setup</span>()<span class="am">${esc(within).replace("within", '<span class="k">within</span>')}</span>`));
  const lines = ['  runs: ["container"],', "  secrets: false,", "  outbound: false,"];
  lines.forEach((l, i) => {
    const s = typed(l, t, HK.rows + .3 + i * .22, 60);
    setHTML(hRows[2 + i], open > 0 ? add_(`<span class="am">${esc(s)}</span>`) : "");
    S(hRows[2 + i], { o: open });
  });
  setHTML(hRows[5], open > 0 ? add_(`<span class="am">}</span>`) : "");
  S(hRows[5], { o: open });
  // " = $ npm install" moves from after "+ setup()" to after "+ }"
  const mv = eio(P(t, HK.rows, HK.rows + .35));
  const mx = 20 + lerp(9, 3, mv) * CW, my = lerp(ys[1], ys[5], mv);
  hMove.style.left = mx + "px"; hMove.style.top = my + "px";
  setHTML(hMove, ` = <span class="am">$</span> npm install`);
  // the agent's tag
  S(agent, { o: env(t, 1.5, HK.rows, .4, .3), x: (1 - eo(P(t, 1.5, 1.9))) * 16 });
  // the end of "$ npm install" is where the lines start
  const ax = H.x + mx + 16 * CW + 6, ay = H.y + 38 + my + r / 2;
  const ringT = P(t, HK.ring, HK.ring + .32);
  const cardH = 38 + 28 + r * 6;
  const rg = { x: H.x - 20, y: H.y - 20, w: H.w + 40, h: cardH + 40 };
  const ringX = rg.x + rg.w;
  // shake after the ring lands
  const sk = P(t, HK.ring + .28, HK.ring + .75);
  const amp = sk > 0 && sk < 1 ? (1 - sk) * 9 : 0;
  S(world, { x: Math.sin(t * 95) * amp, y: Math.cos(t * 77) * amp * .6 });
  S(flash, { o: (sk > 0 ? 1 - sk : 0) * .9 });
  TARGETS.forEach((g, i) => {
    const appear = 3.5 + i * .5;
    const tin = eo(P(t, appear, appear + .45));
    const cut = P(t, HK.ring + .28, HK.ring + .7);
    S(g.el, { o: tin * (1 - cut), x: (1 - tin) * 30 });
    S(g.dim, { o: tin * cut, x: (1 - tin) * 30 });
    const c = bez(ax, ay, TX, g.y + 32);
    g.path.setAttribute("d", `M${c[0]},${c[1]} C${c[2]},${c[3]} ${c[4]},${c[5]} ${c[6]},${c[7]}`);
    const draw = eo(P(t, appear - .1, appear + .4));
    // where the line crosses the ring
    let uc = 0;
    for (let k = 0; k <= 60; k++) { if (bezAt(c, k / 60)[0] >= ringX) { uc = k / 60; break; } }
    const net = i === 2;
    let len = draw, op = 1;
    if (t >= HK.ring + .28) {
      // the internet line is checked: it stops at the ring; the others are gone
      len = net ? lerp(1, uc, eo(P(t, HK.ring + .28, HK.ring + .5))) : 1;
      op = net ? 1 : 1 - P(t, HK.ring + .28, HK.ring + .5);
    }
    g.path.setAttribute("stroke-dasharray", `${len} 1`);
    g.path.setAttribute("opacity", op * (1 - P(t, 10.9, 11.4)));
    const [sx, sy] = bezAt(c, uc);
    const sp = P(t, HK.ring + .28, HK.ring + .55);
    S(g.spark, { x: sx, y: sy, s: .4 + sp * 1.1, o: (sp > 0 && sp < 1 ? Math.pow(1 - sp, 2) : 0) });
    if (net) S(err0, { x: rg.x + 30, y: rg.y + rg.h + 16, o: env(t, HK.ring + .55, 11.2, .35, .3) });
  });
  // the ring falls into place
  ring.style.left = rg.x + "px"; ring.style.top = rg.y + "px"; ring.style.width = rg.w + "px"; ring.style.height = rg.h + "px";
  S(ring, { o: eo(P(t, HK.ring, HK.ring + .12)), s: lerp(1.35, 1, back(ringT)) });
  shock.style.left = rg.x + "px"; shock.style.top = rg.y + "px"; shock.style.width = rg.w + "px"; shock.style.height = rg.h + "px";
  const sh = P(t, HK.ring + .28, HK.ring + .9);
  S(shock, { o: sh > 0 && sh < 1 ? (1 - sh) * .8 : 0, s: 1 + eo(sh) * .25 });
});
caption("A new task.", .9, 3.5);
caption(`What can it <span style="color:var(--red)">reach</span>?`, 3.7, 8.1);
caption(`Only what you <span style="color:var(--amber)">allow</span>.`, 9.4, 11.4);
const hookSub = add("Anything more fails <span style='color:#c9d1d9'>lask check</span>, before it runs.", "top:108px", stage, "sub");
R.push(t => S(hookSub, { o: env(t, 9.9, 11.4, .4, .35) }));

// ===================================================================
// 1. Title (11.6 - 13.6)
// ===================================================================
const title = add(`<div style="display:flex;align-items:center;gap:22px;justify-content:center">${I.logo(76)}<span style="font:800 84px var(--sans);letter-spacing:-2px">Lask</span></div>
  <div style="margin-top:18px;text-align:center;font:500 22px var(--sans);color:var(--dim)">Tasks in pinned containers, checked before they run.</div>`,
  "left:0;top:268px;width:1280px", stage, "c");
R.push(t => {
  const o = env(t, 11.75, 13.6, .45, .4);
  S(title, { o, s: lerp(.86, 1, back(P(t, 11.75, 12.3))) * lerp(1, 1.06, P(t, 12.3, 13.6)), f: `blur(${(1 - o) * 8}px)` });
});

// ===================================================================
// 2. The code (13.4 - 18.6), then docked on the left until 33.6
// ===================================================================
const C = { x: 260, y: 150, w: 760, rowH: 29 };
const CODE = [
  [["cm", "// Each program comes from a pinned image."]],
  [["k", "command"], ["", " { "], ["s", '"python"'], ["", " } "], ["k", "on"], ["", " "], ["im", "#python:3.13.7-alpine3.22"]],
  [["k", "command"], ["", " { "], ["s", '"ruff"'], ["", " } "], ["k", "on"], ["", " "], ["im", "#ghcr.io/astral-sh/ruff:0.13.3-alpine"]],
  [],
  [["cm", "// What a check may reach: no secret, and nothing on the host."]],
  [["k", "access"], ["", " "], ["am", "Sandboxed"], ["", " = { secrets: "], ["k", "false"], ["", ", runs: ["], ["s", '"container"'], ["", "] }"]],
  [],
  [["cm", "// Lint and test at the same time."]],
  [["fn", "ci"], ["", "() "], ["k", "within"], ["", " "], ["am", "Sandboxed"], ["", " = "], ["k", "do"], ["", " {"]],
  [["", "  lint = "], ["k", "async"], ["", " $ ruff check app"]],
  [["", "  test = "], ["k", "async"], ["", " $ python -m unittest discover -s app"]],
  [["", "  all([lint, test])"]],
  [["", "}"]],
];
const seg = l => l.map(([c, s]) => c ? `<span class="${c}">${esc(s)}</span>` : esc(s)).join("");
const code = add(`<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;main.lask</div>`,
  `left:${C.x}px;top:${C.y}px;width:${C.w}px;height:${38 + 26 + CODE.length * C.rowH}px`, world, "card");

const endUrl = add("lask-task-runner.github.io", "left:0;top:598px;width:1280px;text-align:center;font:500 19px var(--sans);color:var(--dim)", stage);
R.push(t => {
  const end = 1 - P(t, 59.3, 60);
  const rt = P(t, 53.0, 53.35);
  S(endRing, { o: Math.min(eo(P(t, 53.0, 53.1)), end), s: lerp(1.7, 1, back(rt)) });
  const sh = P(t, 53.3, 54.0);
  S(endShock, { o: sh > 0 && sh < 1 ? (1 - sh) * .8 * end : 0, s: 1 + eo(sh) * .3 });
  S(endLogo, { o: Math.min(eo(P(t, 53.5, 53.9)), end), s: lerp(.85, 1, back(P(t, 53.5, 54.0))) });
  WORDS.forEach(([, , a], i) => S(endWords[i], { o: Math.min(eo(P(t, a, a + .3)), end), y: (1 - eo(P(t, a, a + .4))) * 16 }));
  S(endBrew, { o: Math.min(eo(P(t, 56.0, 56.4)), end) });
  S(endUrl, { o: Math.min(eo(P(t, 56.4, 56.8)), end) });
  if (t > 53.3 && t < 53.8) {
    const a = (1 - P(t, 53.3, 53.8)) * 6;
    S(world, { x: Math.sin(t * 95) * a, y: Math.cos(t * 77) * a * .6 });
  }
});

// ---------- the background: a slow grid ----------
function drawBg(t) {
  const off = (t * 6) % 40;
  bg.style.background =
    `radial-gradient(ellipse at 50% 42%, rgba(30,60,110,.30), rgba(6,10,17,0) 62%),` +
    `linear-gradient(rgba(120,160,255,.045) 1px, transparent 1px) 0 ${off}px / 40px 40px,` +
    `linear-gradient(90deg, rgba(120,160,255,.045) 1px, transparent 1px) ${off * .5}px 0 / 40px 40px, #060a11`;
}

// ---------- timelines ----------
const FULL = 60;
// the README cut: [from, to, speed] of the full timeline, played in turn
const CUTS = [[0, 11.6, 2.0], [13.5, 17.6, 1.6], [18.7, 27.0, 2.2], [33.7, 41.2, 2.6], [42.6, 49.4, 2.4], [52.7, 60, 3.0]];
const CUT_LEN = CUTS.map(([a, b, s]) => (b - a) / s);
window.DURATION = SHORT ? CUT_LEN.reduce((x, y) => x + y, 0) : FULL;
window.VIEW = [1280, 720];
function fullTime(t) {
  if (!SHORT) return [t, 1];
  let acc = 0;
  for (let i = 0; i < CUTS.length; i++) {
    const [a, , s] = CUTS[i], len = CUT_LEN[i];
    if (t < acc + len || i === CUTS.length - 1) {
      const local = t - acc;
      // dip to the background across each cut
      const dip = i === 0 ? 1 : clamp(local / .12);
      const out = i === CUTS.length - 1 ? 1 : clamp((len - local) / .12);
      return [a + Math.min(local, len) * s, Math.min(dip, out)];
    }
    acc += len;
  }
}
window.render = t => {
  const [ft, vis] = fullTime(t);
  S(world, {});
  // a still grid in the README cut keeps the GIF small
  drawBg(SHORT ? 0 : ft);
  R.forEach(f => f(ft));
  stage.style.opacity = vis;
};
window.render(0);
if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
