<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lask README tour</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #0f151d; --line: #2a333e; --fg: #e8edf2; --dim: #9aa5b1; --faint: #5d6874;
    --green: #85e89d; --blue: #79b8ff; --red: #f97583; --purple: #b392f0; --orange: #ffab70; --str: #9ecbff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: radial-gradient(1000px 520px at 50% -12%, #18222f 0%, var(--bg) 70%); }
  .x { position: absolute; }
  .c { left: 0; right: 0; text-align: center; }
  .mono { font-family: var(--mono); }
  .g { color: var(--green); } .b { color: var(--blue); } .r { color: var(--red); } .p { color: var(--purple); } .o { color: var(--orange); } .s { color: var(--str); }
  .d { color: var(--dim); } .f { color: var(--faint); }
  /* type scale for a README, shown around 960px wide */
  .lbl { top: 30px; font: 600 22px var(--mono); color: var(--green); letter-spacing: 3px; }
  .h { top: 62px; font: 800 54px/1.08 var(--sans); letter-spacing: -1px; }
  .cap { font: 600 30px/1.25 var(--sans); }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
  .pill { font: 600 28px var(--mono); padding: 14px 26px; border-radius: 16px; background: #121a24; border: 2px solid #2f3d4d; white-space: nowrap; }
  .box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .cur { display: inline-block; width: 16px; height: 30px; vertical-align: -5px; background: var(--fg); }
  #mark { top: 252px; left: 0; right: 0; height: 130px; display: flex; justify-content: center; align-items: center; }
  #lamSlot { display: flex; align-items: center; height: 112px; }
  .lam { flex: none; width: 112px; height: 112px; border-radius: 26px; background: linear-gradient(145deg, #2b3a55, #151c28);
    border: 2px solid #3a4a66; display: grid; place-items: center; font: 600 76px/1 var(--mono); color: var(--green);
    box-shadow: 0 20px 60px rgba(133,232,157,.14); }
  #letters { display: flex; align-items: baseline; font: 800 110px/1 var(--sans); white-space: pre; }
  #letters .ch { display: inline-block; overflow: hidden; position: relative; }
  #letters .ch.plus { font: 500 92px/1 var(--mono); color: var(--green); }
  #letters .ch .alt { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const expo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const snap = x => { x = clamp(x); return x < .5 ? 16*x*x*x*x*x : 1 - Math.pow(-2*x + 2, 5) / 2; };
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, q) => a + (b - a) * q;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const stage = document.getElementById("stage");
const ITEMS = [], UPD = [];
function add(html, style, a, b, fx = "up", opts = {}) {
  const d = document.createElement("div");
  d.className = "x " + (opts.cls || "");
  d.style.cssText = style; d.innerHTML = html;
  (opts.parent || stage).appendChild(d);
  ITEMS.push({ d, a, b, fx, ...opts });
  return d;
}
const blink = t => Math.floor(t * 2.2) % 2 === 0;
const fmt = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
const RUN = 552; // the failing CI run: 9m 12s

// ---------- timeline ----------
window.DURATION = 62.0;
const I0 = 0;
const S2 = 4.6, S4 = 9.0, S5 = 15.5, S6 = 19.5, S7 = 29.0, S8 = 36.5, S9 = 47.0;
const T = { introEnd: 4.6, endA: 57.0 };
const COL = { python: "#ffab70", node: "#85e89d" };
const ICON = (c = "#79b8ff", w = 26) => `<svg width="${w}" height="${w * .7}" viewBox="0 0 26 18" style="vertical-align:-3px"><rect x="1" y="1" width="24" height="16" rx="2" fill="none" stroke="${c}" stroke-width="2"/><path d="M6 4v10M10 4v10M14 4v10M18 4v10" stroke="${c}" stroke-width="1.6"/></svg>`;
const typedAt = (t, txt, a, cps = 22) => txt.slice(0, Math.max(0, Math.min(txt.length, Math.floor((t - a) * cps))));
const caret = on => on ? `<span class="cur" style="width:12px;height:24px;vertical-align:-4px"></span>` : "";
const tag = (img, n) => `<span style="color:${img.startsWith("python") ? COL.python : COL.node}">[#${img}:${n}]</span>`;

// step titles and the line of explanation under each
const STEP = (n, title, a, b) => {
  add(`${n} <span>/ 5</span>`, "", a, b, "fade", { cls: "lbl c" });
  add(title, "", a + .1, b, "up", { cls: "h c" });
};
const NOTE = (html, a, b) => add(html, "top:654px;padding:0 70px;font-size:27px", a, b, "up", { cls: "c cap" });
STEP(1, "Try a command in the REPL.", S2, S5);
STEP(2, "Keep it as a task.", S5, S7);
STEP(3, "Run it.", S7, S8);
STEP(4, "Same run, anywhere.", S8, S9);
STEP(5, "Secrets stay in Vault.", S9, T.endA);
NOTE(`Start with one command. No project, no config.`, S2 + .6, S4);
NOTE(`Lask starts a <span class="b">Docker</span> container from that image and runs the command in it.`, S4 + .3, S5);
NOTE(`The same line, saved in <span class="mono b">main.lask</span>, is a task.`, S5 + 1.2, S6);
NOTE(`Add more. A mistake shows up <span class="g">in your editor</span>, before anything runs.`, S6 + .4, 25.9);
NOTE(`Then the whole job: <span class="p">deploy()</span> and <span class="p">release()</span>, each command in its own image.`, 26.1, S7);
NOTE(`Tests run side by side, then each deploy step runs in its own container.`, S7 + .6, S8);
NOTE(`Both run the same pinned images on <span class="b">Docker</span>, <span class="g">so they behave the same</span>.`, S8 + .8, S9);
NOTE(`Point an environment variable at <span style="color:#ffdf5d">Vault</span>. The program stays the same.`, S9 + .6, S9 + 3.6);
NOTE(`On your laptop and in CI, Lask reads the value only when a task needs it, and logs it as <span class="mono g">***</span>.`, S9 + 3.8, S9 + 6.2);
NOTE(`An AI agent driving Lask sees the reference and <span class="mono g">***</span>, <span class="g">not the key</span>.`, S9 + 6.4, T.endA);

// ===== 2-4: the REPL, and what happens underneath =====
{
  const s = S2, e = S5;
  const REPL_CMD = "$[#python:3.12] python -m unittest";
  const term = add(`<div style="height:34px;background:#161b22;border-bottom:2px solid var(--line);border-radius:16px 16px 0 0;font:600 16px var(--mono);color:var(--dim);display:flex;align-items:center;justify-content:center">zsh — my-project</div>
     <div id="replTx" style="padding:16px 22px;font:500 21px/1.55 var(--mono);white-space:pre"></div>`,
    "left:340px;width:600px;top:150px;height:470px;overflow:hidden", s + .1, e + .4, "up", { cls: "card" });
  // Docker side
  const dock = add(`<div style="display:flex;align-items:center;gap:12px;padding:16px 22px;font:800 30px var(--sans);color:#79b8ff">${ICON("#79b8ff", 40)} Docker</div>`,
    "left:760px;width:460px;top:150px;height:470px;border:3px dashed #2f4a6a;border-radius:22px;background:#0c141d", S4 + .2, e, "right");
  const box = add(`<div style="display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 16px;background:#132030;border-bottom:2px solid #2a3a4e;font:700 17px var(--sans);color:#79b8ff">
       <span>${ICON()}&nbsp; container</span><span id="bxSt" style="font-size:20px"></span></div>
     <div style="padding:10px 16px 0;font:700 26px var(--mono);color:${COL.python}">#python:3.12 <span style="font:600 14px var(--mono);color:var(--faint)">📌 sha256:3f9c…</span></div>
     <div style="margin:10px 14px 0;height:150px;border-radius:10px;background:#070a0e;border:1px solid #222b35;padding:10px 14px;font:500 19px/1.5 var(--mono)">
       <div id="bxCmd" style="font-weight:700"></div><div id="bxOut" class="d"></div></div>
     <div id="bxBar" style="position:absolute;left:0;bottom:0;height:7px;width:100%;background:${COL.python};transform-origin:0 50%;transform:scaleX(0)"></div>`,
    "left:790px;width:400px;top:240px;height:280px;overflow:hidden", S4 + 1.2, e, "pop", { cls: "card" });
  const arrowOut = add(`<svg width="160" height="60"><path d="M6 30 H140 M118 10 L144 30 L118 50" stroke="#79b8ff" stroke-width="5" fill="none"/></svg><div style="font:700 18px var(--mono);color:#79b8ff;margin-top:-6px">run #python:3.12</div>`,
    "left:620px;top:300px;width:170px;text-align:center", S4 + .7, e, "right");
  const arrowBack = add(`<div style="font:700 18px var(--mono);color:var(--green);margin-bottom:-6px">output</div><svg width="160" height="60"><path d="M154 30 H20 M42 10 L16 30 L42 50" stroke="#85e89d" stroke-width="5" fill="none"/></svg>`,
    "left:620px;top:420px;width:170px;text-align:center", S4 + 3.0, e, "fade");
  const LOG = [ // [time, line] — the REPL's real output format, timestamps left out
    [S4 + 3.1, `${tag("python:3.12", 1)} $ python -m unittest`],
    [S4 + 3.5, `${tag("python:3.12", 1)} <span class="f">2|</span> <span class="d">..................</span>`],
    [S4 + 3.9, `${tag("python:3.12", 1)} <span class="f">2|</span> Ran 18 tests in 0.004s`],
    [S4 + 4.1, `${tag("python:3.12", 1)} <span class="f">2|</span> <span class="g">OK</span>`],
    [S4 + 4.5, `${tag("python:3.12", 1)} <span class="g">exit 0</span>`],
    [S4 + 4.7, `<span class="s">""</span>`],
  ];
  UPD.push(t => {
    if (t < s || t >= e + .4) return;
    // the terminal moves left to make room for Docker
    const m = ease(ramp(t, S4, S4 + .6));
    term.style.left = lerp(340, 40, m) + "px"; term.style.width = lerp(600, 560, m) + "px";
    const a1 = s + .4, a2 = s + 1.6;
    let h = `<span class="g">❯</span> ${typedAt(t, "lask repl", a1, 16)}`;
    if (t < a1 + .8) h += caret(true);
    if (t >= a1 + .8) {
      h += `\n<span class="d">lask repl — :quit to exit</span>\n<span class="g">lask&gt;</span> ${esc(typedAt(t, REPL_CMD, a2, 15))}`;
      const outs = LOG.filter(([at]) => t >= at).map(([, l]) => l);
      if (!outs.length) h += caret(true);
      else h += "\n" + outs.join("\n") + (t >= S4 + 4.7 ? `\n<span class="g">lask&gt;</span> ` + caret(blink(t)) : "");
    }
    // the line that becomes a task glows before it leaves
    const glow = t >= S5 - .5 ? "background:#79b8ff33;border-radius:6px;box-shadow:0 0 0 4px #79b8ff33;" : "";
    const gone = t >= S5 + .2 ? "visibility:hidden;" : "";
    h = h.replace(esc(REPL_CMD), `<span id="replCmd" style="${glow}${gone}">${esc(REPL_CMD)}</span>`);
    document.getElementById("replTx").innerHTML = h;
    // inside the container
    const p = ease(ramp(t, S4 + 1.9, S4 + 4.4));
    document.getElementById("bxCmd").textContent = typedAt(t, "$ python -m unittest", S4 + 1.6, 40);
    document.getElementById("bxOut").innerHTML = (p > .2 ? ".................." : "") + (p > .7 ? "<br>Ran 18 tests in 0.004s" : "") + (p >= 1 ? `<br><span class="g">OK</span>` : "");
    document.getElementById("bxBar").style.transform = `scaleX(${p})`;
    document.getElementById("bxSt").innerHTML = p >= 1 ? `<span class="g">✓</span>` : p > 0 ? `<span style="color:${COL.python}">●</span>` : "";
    box.style.borderColor = p >= 1 ? "#85e89d" : p > 0 ? COL.python : "";
    box.style.boxShadow = p > 0 && p < 1 ? `0 0 ${30 + 18 * Math.sin(t * 9)}px ${COL.python}55` : "";
  });
}

// ===== 5-6: the line becomes a task in main.lask, more code, an error fixed, then the rest in one burst =====
// The code is a real module: `lask check` passes on the final text (the typo `wbe` is the only edit).
const CODE = [
  "test_api() = $[#python:3.12] python -m unittest",
  "test_web() = $[#node:20] npm test",
  "",
  "test() = do {",
  "  api = async test_api()",
  "  web = async test_web()",
  "  await api",
  "  await wbe",
  "}",
  "",
  "deploy() = do {",
  "  $[#python:3.12] pip install -r requirements.txt -t vendor",
  "  $[#hashicorp/terraform:1.9] terraform apply -auto-approve",
  "  $[#node:20] npm run build",
  "  $[#amazon/aws-cli:2.17.0] aws s3 sync dist s3://my-site",
  "}",
  "",
  "release() = do {",
  "  test()",
  "  deploy()",
  "}",
];
// which code line is busy while each container runs (0-based), for the run step
const RUNS = [ // [label, image, colour, code line, start, end] relative to the start of a run
  ["test_api",  "python:3.12",            "#ffab70", 4,  .5, 2.0],
  ["test_web",  "node:20",                "#85e89d", 5,  .5, 2.6],
  ["pip install", "python:3.12",            "#ffab70", 11, 2.8, 3.5],
  ["terraform", "hashicorp/terraform:1.9", "#b392f0", 12, 3.6, 4.6],
  ["npm build", "node:20",                "#85e89d", 13, 4.7, 5.3],
  ["s3 sync",   "amazon/aws-cli:2.17.0",  "#ffdf5d", 14, 5.4, 6.0],
];
const RUN_LOG = [ // [at, image, n, text] — the real log format, timestamps left out
  [.50, "node:20", 2, "$ npm test"],
  [.52, "python:3.12", 1, "$ python -m unittest"],
  [1.8, "python:3.12", 1, `<span class="f">2|</span> Ran 18 tests · <span class="g">OK</span>`],
  [2.0, "python:3.12", 1, `<span class="g">exit 0</span>`],
  [2.4, "node:20", 2, `<span class="f">1|</span> Tests 12 passed (12)`],
  [2.6, "node:20", 2, `<span class="g">exit 0</span>`],
  [2.8, "python:3.12", 3, "$ pip install -r requirements.txt …"],
  [3.5, "python:3.12", 3, `<span class="g">exit 0</span>`],
  [3.6, "hashicorp/terraform:1.9", 4, "$ terraform apply -auto-approve"],
  [4.4, "hashicorp/terraform:1.9", 4, `<span class="f">1|</span> Apply complete! Resources: 26 added`],
  [4.7, "node:20", 5, "$ npm run build"],
  [5.2, "node:20", 5, `<span class="f">1|</span> ✓ built in 2.1s`],
  [5.4, "amazon/aws-cli:2.17.0", 6, "$ aws s3 sync dist s3://my-site"],
  [5.9, "amazon/aws-cli:2.17.0", 6, `<span class="f">1|</span> upload: dist/index.html`],
  [6.0, "amazon/aws-cli:2.17.0", 6, `<span class="g">exit 0</span>`],
];
const IMGCOL = { "python:3.12": "#ffab70", "node:20": "#85e89d", "hashicorp/terraform:1.9": "#b392f0", "amazon/aws-cli:2.17.0": "#ffdf5d" };
const ltag = (img, n) => `<span style="color:${IMGCOL[img]}">[#${img}:${n}]</span>`;

// a run panel: six container chips and the log, driven by u = seconds since `lask run release`
function runPanel(prefix, x, y, w, h, a, b, title, extra = "", docker = false) {
  const chips = RUNS.map(([label, img, c], i) => `<div id="${prefix}c${i}" style="position:relative;overflow:hidden;border:2px solid var(--line);border-radius:10px;background:#0f151d;padding:6px 10px;font:700 15px var(--mono);color:${c};white-space:nowrap">
      <span style="display:flex;justify-content:space-between;align-items:center;color:var(--fg);font:700 14px var(--sans)"><span>${ICON(c, 16)}&nbsp;${label}</span><span class="stt" style="color:${c}"></span></span>
      <div style="margin-top:2px;overflow:hidden;text-overflow:ellipsis">#${img}</div>
      <div class="pb" style="position:absolute;left:0;bottom:0;height:5px;width:100%;background:${c};transform-origin:0 50%;transform:scaleX(0)"></div></div>`).join("");
  return add(`<div style="height:34px;background:#161b22;border-bottom:2px solid var(--line);border-radius:16px 16px 0 0;font:700 17px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px">${title}</div>
     ${extra}
     ${docker
       ? `<div style="margin:10px 12px 0;border:2px dashed #2f4a6a;border-radius:12px;background:#0c141d;padding:5px 8px 8px">
            <div style="font:700 13px var(--sans);color:#79b8ff;display:flex;align-items:center;gap:6px">${ICON("#79b8ff", 16)} Docker · the same pinned images</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:5px">${chips}</div></div>`
       : `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 0">${chips}</div>`}
     <div id="${prefix}log" style="padding:10px 16px;font:500 15px/1.55 var(--mono);white-space:pre;overflow:hidden"></div>`,
    `left:${x}px;width:${w}px;top:${y}px;height:${h}px;overflow:hidden`, a, b, "up", { cls: "card" });
}
function driveRun(prefix, u, rows, panel) {
  const lines = [`<span class="g">❯</span> ${"lask run release".slice(0, Math.max(0, Math.floor((u + .5) * 30)))}`];
  RUN_LOG.forEach(([at, img, n, txt]) => { if (u >= at) lines.push(`${ltag(img, n)} ${txt}`); });
  if (u >= 6.2) lines.push(`<span class="g">✓ release finished</span>`);
  document.getElementById(prefix + "log").innerHTML = lines.slice(-rows).join("\n");
  RUNS.forEach(([, , c, , a, b], i) => {
    const d = document.getElementById(prefix + "c" + i), p = ease(ramp(u, a, b));
    d.querySelector(".pb").style.transform = `scaleX(${p})`;
    d.querySelector(".stt").innerHTML = p >= 1 ? `<span class="g">✓</span>` : p > 0 ? `●` : "";
    d.style.borderColor = p >= 1 ? "#85e89d" : p > 0 ? c : "#2a333e";
    d.style.boxShadow = p > 0 && p < 1 ? `0 0 ${22 + 14 * Math.sin(u * 9)}px ${c}66` : "";
  });
  if (panel) {
    const done = u >= 6.2;
    panel.style.borderColor = done ? "#85e89d" : "";
    panel.style.boxShadow = done ? "0 0 0 2px #85e89d55, 0 0 60px #85e89d22" : "";
  }
}

{
  const s = S5, e = S8;
  const ed = add(`<div style="height:34px;background:#161b22;border-bottom:2px solid var(--line);border-radius:16px 16px 0 0;font:600 16px var(--mono);color:var(--dim);display:flex;align-items:center;justify-content:center">main.lask</div>
     <div id="edCode" style="padding:12px 0"></div>
     <div id="edStatus" style="position:absolute;left:0;right:0;bottom:0;height:34px;border-top:2px solid var(--line);background:var(--panel);padding:0 18px;display:flex;align-items:center;font:600 17px var(--sans)"></div>
     <div id="squig" style="position:absolute;height:6px;opacity:0;background:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='4'><path d='M0 3 L1.5 1 L3 3 L4.5 1 L6 3' fill='none' stroke='%23f97583' stroke-width='1.2'/></svg>&quot;) repeat-x"></div>
     <div id="tip" style="position:absolute;opacity:0;padding:8px 14px;border-radius:8px;background:#1c2128;border:1px solid #f9758399;font:600 18px var(--mono);white-space:nowrap;box-shadow:0 10px 30px #0008"><span class="r">E-NAME-UNDEFINED</span> undefined name: 'wbe'</div>`,
    "left:240px;width:800px;top:140px;height:496px;overflow:hidden", s + .25, e, "fade", { cls: "card" });
  const fly = add(`<span id="flyTx" class="mono" style="display:inline-block;font:500 21px var(--mono);padding:0;border-radius:6px;background:#79b8ff33;box-shadow:0 0 0 4px #79b8ff33;white-space:nowrap">$[#python:3.12] python -m unittest</span>`,
    "left:0;top:0;visibility:hidden", s, s + 1.4, "none", { manual: true });
  const probe = document.createElement("span"); probe.style.cssText = "font:500 22px var(--mono);position:absolute;visibility:hidden"; probe.textContent = "x".repeat(50);
  document.body.appendChild(probe); const CW22 = probe.getBoundingClientRect().width / 50; probe.remove();
  const hl = l => esc(l)
    .replace(/^([a-z_]+)(\(\))/, `<span class="p">$1</span>$2`)
    .replace(/(\$\[)(#[^\]]+)(\])/, (m, a, img, c) => `<span class="r">${a}</span><span style="color:${IMGCOL[img.slice(1)] || "#85e89d"}">${img}</span><span class="r">${c}</span>`)
    .replace(/\b(do|async|await)\b/g, `<span class="r">$1</span>`)
    .replace(/\b(test_api|test_web|test|deploy)\(\)/g, (m, n) => `<span class="p">${n}</span>()`);
  // when each line starts: the first nine one by one, the rest in a burst
  const START = {}; let at = s + 3.4;
  for (let i = 1; i <= 8; i++) { START[i] = at; at += Math.max(.25, CODE[i].length / 34); }
  const ERR = START[7] + .6, FIX = ERR + 2.2, BURST = FIX + 1.0;
  for (let i = 9; i < CODE.length; i++) START[i] = BURST + (i - 9) * .11;
  // font shrinks so all 22 lines fit once the burst starts
  UPD.push(t => {
    if (t < s || t >= e) return;
    const src = document.getElementById("replCmd").getBoundingClientRect();
    const LAND = s + 1.3, q2 = ease(ramp(t, s + .2, LAND));
    fly.style.visibility = t >= s + .2 && t < LAND ? "visible" : "hidden";
    fly.style.left = lerp(src.left, 240 + 62 + 13 * CW22, q2) + "px";
    fly.style.top = lerp(src.top, 140 + 34 + 12 + (34 - 22 * 1.2) / 2, q2) + "px";
    document.getElementById("flyTx").style.fontSize = lerp(21, 22, q2) + "px";
    fly.style.transform = `translateY(${-Math.sin(Math.PI * q2) * 40}px)`;
    const z = ease(ramp(t, BURST - .3, BURST + .5)), fs = lerp(22, 16, z), lh = lerp(34, 19.8, z);
    const runU = t - (S7 + .3), running = t >= S7;
    let rows = "";
    CODE.forEach((l, i) => {
      let txt = "";
      if (i === 0) {
        const k = Math.max(0, Math.min(13, Math.floor((t - s - 1.5) * 18)));
        txt = t < s + 1.3 ? "" : "test_api() = ".slice(0, k) + " ".repeat(13 - k) + "$[#python:3.12] python -m unittest";
      }
      else if (t >= START[i]) txt = l.slice(0, Math.floor((t - START[i]) * (i >= 9 ? 120 : 34)));
      if (i === 7 && t >= FIX) { const k = Math.round(ramp(t, FIX, FIX + .5) * 6); txt = k <= 3 ? "  await " + "wbe".slice(0, 3 - k) : "  await " + "web".slice(0, k - 3); }
      if (i >= 9 && t < START[i]) return;
      const busy = running ? RUNS.find(r => r[3] === i && runU >= r[4] && runU < r[5] + .15) : null;
      rows += `<div style="position:relative;height:${lh}px;line-height:${lh}px;font:500 ${fs}px var(--mono);white-space:pre;padding-left:${lerp(62, 50, z)}px${busy ? `;background:${busy[2]}2a;box-shadow:inset 4px 0 ${busy[2]}` : ""}">` +
        `<span style="position:absolute;left:0;width:${lerp(44, 36, z)}px;text-align:right;color:#484f58">${i + 1}</span>${hl(txt)}</div>`;
    });
    document.getElementById("edCode").innerHTML = rows;
    const errOn = t >= ERR && t < FIX + .3, sq = document.getElementById("squig"), tip = document.getElementById("tip");
    const x0 = 62 + 8 * CW22, y0 = 34 + 12 + 7 * 34;
    sq.style.left = x0 + "px"; sq.style.top = (y0 + 28) + "px"; sq.style.width = (3 * CW22) + "px"; sq.style.opacity = errOn ? 1 : 0;
    tip.style.left = (x0 - 10) + "px"; tip.style.top = (y0 + 40) + "px"; tip.style.opacity = t >= ERR + .3 && t < FIX ? 1 : 0;
    document.getElementById("edStatus").innerHTML = t < START[1] ? "" : errOn
      ? `<span class="r">✕ 1 problem</span>&nbsp;&nbsp;<span class="d">main.lask:8:9 E-NAME-UNDEFINED</span>`
      : `<span class="g">✓ No problems</span>&nbsp;&nbsp;<span class="d">checked as you type</span>`;
    const m = ease(ramp(t, S7, S7 + .6));
    ed.style.left = lerp(240, 30, m) + "px";
    ed.style.transformOrigin = "0 0"; ed.style.transform = `scale(${lerp(1, .74, m)})`;
  });
  window.__BURST = BURST;
}

  lettersEl.appendChild(s); return s;
});
const W0 = chEls.map(s => s.getBoundingClientRect().width);
const upEl = chEls[0].querySelector(".up"), loEl = chEls[0].querySelector(".lo");
const W_L = upEl.getBoundingClientRect().width, W_l = loEl.getBoundingClientRect().width;
function renderIntro(t) {
  t -= I0;
  const inP = expo(ramp(t, .15, .65)), dim = snap(ramp(t, .75, 1.0)), col = snap(ramp(t, 1.2, 1.75));
  chEls.forEach((s, i) => {
    if (KEEP.has(i)) {
      if (i === 0) { s.style.width = (W_l + (W_L - W_l) * col) + "px"; loEl.style.opacity = 1 - col; upEl.style.opacity = col; }
      else s.style.width = W0[i] + "px";
    } else {
      s.style.width = (W0[i] * (1 - col)) + "px";
      s.style.opacity = (1 - .78 * dim) * (1 - clamp(col * 1.6));
      s.style.transform = `translateY(${col * 28}px)`;
    }
  });
  lettersEl.style.letterSpacing = (-3 * col) + "px";
  const mark = document.getElementById("mark"); mark.style.opacity = inP; mark.style.transform = `translateY(${(1 - inP) * 20}px)`;
  const tg = expo(ramp(t, 2.5, 2.95)), tag = document.getElementById("tag");
  tag.style.opacity = tg; tag.style.transform = `translateY(${(1 - tg) * 10}px)`;
}


// ===== end card =====
add(`<div style="display:flex;align-items:center;justify-content:center;gap:24px"><div style="font:800 100px/1 var(--sans);letter-spacing:-3px">Lask</div></div>`,
  "top:170px", T.endA + .1, 99, "up", { cls: "c" });
add(`Install Docker and Lask. That's the whole toolchain.`, "top:320px;font:600 34px var(--sans)", T.endA + .5, 99, "up", { cls: "c" });
add(`<span class="d">❯</span> <span id="endTx"></span><span class="cur" id="endCur"></span>`,
  "top:410px;left:0;right:0;margin:0 auto;width:max-content;min-width:440px", T.endA + .8, 99, "up", { cls: "pill" });
add(`github.com/lask-task-runner/lask`, "top:540px;font:600 28px var(--mono);color:var(--dim)", T.endA + 1.2, 99, "up", { cls: "c" });


// ---------- render ----------
function retype(prefix, from, to, p) {
  const steps = from.length + to.length, k = Math.round(p * steps);
  return k <= from.length ? prefix + from.slice(0, from.length - k) : prefix + to.slice(0, k - from.length);
}
function render(t) {
  renderIntro(t);
  for (const it of ITEMS) {
    const { d, a, b, fx } = it;
    if (it.manual) continue;
    if (t < a - .01 || t >= b) { d.style.visibility = "hidden"; continue; }
    d.style.visibility = "visible";
    const i = expo(ramp(t, a, a + .5)), o = 1 - snap(ramp(t, b - .3, b));
    let op = fx === "none" ? o : Math.min(i, o), tf = "";
    if (fx === "up") tf = `translateY(${(1 - i) * 24}px)`;
    if (fx === "right") tf = `translateX(${(1 - i) * -36}px)`;
    if (fx === "pop") tf = `scale(${.6 + .4 * i})`;
    d.style.opacity = op; d.style.transform = tf;
  }
  UPD.forEach(f => f(t));   // after the generic pass, so hand-driven transforms win
  const e0 = T.endA + 1.0;
  document.getElementById("endTx").textContent = t < e0 + 1.1
    ? "lask run task".slice(0, Math.round(13 * ramp(t, e0, e0 + .6)))
    : retype("lask ", "run task", "make it simple", ramp(t, e0 + 1.1, e0 + 2.1));
  document.getElementById("endCur").style.opacity = (t >= e0 && t < e0 + 2.3) || blink(t) ? 1 : 0;
}
window.render = render;
window.VIEW = [1280, 720];

// ---------- the README cut (tour.html?short): about 30 seconds, one highlight per step ----------
if (new URLSearchParams(location.search).has("short")) {
  // Played at real speed; the CI looks and Vault are left to the full MP4.
  const PIECES = [ // [full start, full end]
    [0, 3.4],                      // lambda + task -> Lask
    [S4 + .5, S4 + 5.2],           // the REPL line runs in a container
    [22.4, 26.0],                  // saved as a task; a typo flagged in the editor, then fixed
    [26.0, 28.6],                  // the rest of the job, in one burst
    [S7 + .3, S7 + 6.8],           // lask run release
    [S8 + .8, S8 + 2.9],           // the same run on a laptop and in CI, on Docker
    [S8 + 9.0, S9 - .02],           // ...on any CI, stopping before step 5 begins
    [T.endA, T.endA + 4.5],        // lask make it simple
  ];
  let c0 = 0;
  const SEGS = PIECES.map(([fa, fb]) => { const seg = [c0, c0 + (fb - fa), fa, fb]; c0 += fb - fa; return seg; });
  window.DURATION = c0;
  stage.querySelectorAll(".lbl span").forEach(e => { if (e.textContent === "/ 5") e.textContent = "/ 4"; });
  const label = [...stage.querySelectorAll("span")].find(e => e.textContent === "⏱ Lask in 1 minute");
  if (label) label.textContent = "⏱ Lask in 30 seconds";
  const renderFull = render;
  window.render = ts => {
    const [a, b, fa, fb] = SEGS.find(([a, b]) => ts >= a && ts < b) || SEGS[SEGS.length - 1];
    renderFull(fa + (fb - fa) * clamp((ts - a) / (b - a)));
  };
}

if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { window.render(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
  loop();
} else window.render(0);
</script>
</body>
